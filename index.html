<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // apply the saved studio theme before first paint (dark by default)
      try {
        var t = localStorage.getItem('roboarena-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B1624" />
    <meta name="description" content="Plan, simulate and compare warehouse robot fleets. Deterministic, local-first, honestly labeled heuristics." />
    <meta property="og:title" content="RoboArena — Warehouse Robotics Simulation Studio" />
